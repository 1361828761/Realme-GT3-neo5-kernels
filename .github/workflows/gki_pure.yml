name: Build Pure GKI 5.10 (android12-5.10) for Droidspaces

on:
  workflow_dispatch:
    inputs:
      use_device_config:
        description: 'Use full device .config instead of gki_defconfig'
        required: false
        default: 'false'
      kernel_branch:
        description: "GKI branch"
        required: true
        default: "android12-5.10"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            python3 git curl cpio rsync kmod device-tree-compiler \
            clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu
          clang-12 --version
          ld.lld-12 --version
          # 统一 unversioned 工具链名（Kconfig 里硬编码 ld.lld）
          sudo ln -sf /usr/bin/clang-12        /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-12      /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-12       /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-12      /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-12      /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-12 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-12 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-12   /usr/local/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-readelf-12 /usr/local/bin/llvm-readelf
          which clang ld.lld llvm-ar llvm-nm llvm-objcopy

      - name: Clone GKI source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/aosp-mirror/kernel_common gki
          cd gki
          head -5 Makefile
          echo "--- gki_defconfig exists? ---"
          ls -la arch/arm64/configs/gki_defconfig

      - name: Apply kABI patches
        run: |
          cd gki
          patch -p1 -F3 --forward < ../kernel-patches/001-sysvipc-kabi.patch
          patch -p1 -F3 --forward < ../kernel-patches/002-posix-mqueue-kabi.patch
          echo "--- verify slots ---"
          grep -n "ANDROID_KABI_USE(6" include/linux/sched.h
          grep -n "ANDROID_KABI_USE(1, unsigned long mq_bytes)" include/linux/sched/user.h

      - name: Patch gki_defconfig
        run: |
          cd gki
          if [ "${{ github.event.inputs.use_device_config }}" = "true" ]; then
            echo '>>> using full device .config as base'
            cp ../device-ref/device.config arch/arm64/configs/gki_defconfig
            sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/' arch/arm64/configs/gki_defconfig || true
            sed -i 's/^CONFIG_TRIM_UNUSED_KSYMS=y/# CONFIG_TRIM_UNUSED_KSYMS is not set/' arch/arm64/configs/gki_defconfig || true
          fi
          CFG=arch/arm64/configs/gki_defconfig
          for c in CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS \
                   CONFIG_DEVTMPFS CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
                   CONFIG_USER_NS CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE CONFIG_MACVLAN \
                   CONFIG_NETFILTER_XT_TARGET_LOG CONFIG_NETFILTER_XT_MATCH_RECENT CONFIG_NETFILTER_XT_SET \
                   CONFIG_IP_SET CONFIG_IP_SET_HASH_IP CONFIG_IP_SET_HASH_NET \
                   CONFIG_TMPFS_XATTR CONFIG_TMPFS_POSIX_ACL; do
            if grep -q "^# $c is not set" $CFG; then
              sed -i "s|^# $c is not set|$c=y|" $CFG
            elif ! grep -q "^$c=" $CFG; then
              echo "$c=y" >> $CFG
            else
              sed -i "s|^$c=.*|$c=y|" $CFG
            fi
          done
          echo "--- final check ---"
          for c in CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS CONFIG_DEVTMPFS \
                   CONFIG_USER_NS CONFIG_IP_SET CONFIG_MACVLAN CONFIG_TMPFS_XATTR; do
            grep -n "^$c=" $CFG || echo "MISSING: $c"
          done

      - name: Configure
        run: |
          cd gki
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CLANG_TRIPLE=$CLANG_TRIPLE gki_defconfig
          # 仅关闭调试信息以加速编译；LTO/CFI/SCS 必须保留，否则厂商 .ko 因缺 __cfi_slowpath 拒绝加载
          ./scripts/config --file .config -d DEBUG_INFO || true
          ./scripts/config --file .config -d DEBUG_INFO_DWARF4 || true
          ./scripts/config --file .config -d GDB_SCRIPTS || true
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          echo "=== 关键项核对 ==="
          for c in CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS CONFIG_DEVTMPFS \
                   CONFIG_USER_NS CONFIG_IP_SET CONFIG_MACVLAN CONFIG_TMPFS_XATTR CONFIG_TMPFS_POSIX_ACL \
                   CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_ANDROID_BINDERFS CONFIG_MODVERSIONS \
                   CONFIG_MODULES CONFIG_SECCOMP_FILTER; do
            printf "%-45s " "$c"; grep "^$c=" .config || echo "NOT SET"
          done

      - name: Build kernel
        run: |
          cd gki
          set -o pipefail
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc) Image > build.log 2>&1 || {
            echo "=== 编译失败，错误摘要 ==="
            grep -nE "error:|Error [0-9]|fatal|undefined|No rule" build.log | head -40
            echo "=== 最后 80 行 ==="
            tail -80 build.log
            exit 1
          }
          echo "=== 编译成功 ==="
          tail -20 build.log
          ls -la arch/arm64/boot/Image
          echo "=== 导出符号表 (5.10 叫 vmlinux.symvers) ==="
          ls -la vmlinux.symvers || true
          wc -l vmlinux.symvers 2>/dev/null || true
          ls -la Module.symvers 2>/dev/null || true
          echo "=== 关键符号 CRC 抽查 ==="
          grep -E "\b(__cfi_slowpath|__kmalloc|__stack_chk_fail|__arch_copy_from_user|__mutex_init)\b" vmlinux.symvers 2>/dev/null || echo "(未找到)"
          echo "=== vmlinux 体积 ==="
          ls -la vmlinux || true

      - name: ABI self-check against device reference
        run: |
          python3 - <<'PY'
          import sys
          def load_sv(p):
              d={}
              for line in open(p,encoding='utf-8',errors='replace'):
                  x=line.rstrip('\n').split('\t')
                  if len(x)>=2 and x[0].startswith('0x'): d[x[1]]=int(x[0],16)
              return d
          def load_ref(p):
              d={}
              for line in open(p,encoding='utf-8',errors='replace'):
                  x=line.rstrip('\n').split('\t')
                  if len(x)>=2: d[x[0]]=int(x[1].split(',')[0],16)
              return d
          try:
              new=load_sv('gki/vmlinux.symvers')
          except Exception as e:
              print('::error::no symvers',e); sys.exit(1)
          dev=load_sv('device-ref/vmlinux.symvers')
          ref=load_ref('device-ref/crc_ref.txt')
          common=set(new)&set(dev)
          diff=[s for s in common if new[s]!=dev[s]]
          ok=bad=miss=0
          for s,c in ref.items():
              if s not in new: miss+=1
              elif new[s]==c: ok+=1
              else: bad+=1
          print(f'=== ABI SELF-CHECK ===')
          print(f'vs device GKI symvers : common={len(common)} crc_diff={len(diff)}')
          print(f'vs vendor .ko crc_ref : ok={ok} bad={bad} missing={miss}')
          if bad==0 and ok>=1100:
              print('::notice::ABI MATCH - kernel is safe to flash')
          else:
              print(f'::warning::ABI MISMATCH - do NOT flash ({bad} conflicts)')
          with open('abi_report.txt','w') as f:
              f.write(f'common={len(common)} crc_diff={len(diff)} ok={ok} bad={bad} missing={miss}\n')
          PY
          echo "--- report ---"; cat abi_report.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gki_pure
          path: |
            gki/arch/arm64/boot/Image
            gki/vmlinux.symvers
            gki/Module.symvers
            gki/.config
            gki/vmlinux
          if-no-files-found: warn