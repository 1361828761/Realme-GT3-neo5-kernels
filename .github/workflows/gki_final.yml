name: GKI final (device config + force LTO/CFI)
on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        required: true
        default: 'deprecated/android12-5.10-2023-01'
      with_kabi_patches:
        required: true
        default: 'false'
      with_droidspaces_cfg:
        required: true
        default: 'true'
      cfg_set:
        description: 'none | core | devtmpfs | full'
        required: true
        default: 'core'
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            python3 git curl cpio rsync kmod device-tree-compiler clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/clang-12 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-12 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-12 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-12 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-12 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-12 /usr/local/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-readelf-12 /usr/local/bin/llvm-readelf
      - name: clone
        run: git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" https://github.com/aosp-mirror/kernel_common gki
      - name: force HAS_LTO_CLANG
        run: |
          cd gki
          python3 - <<'PY'
          s=open('arch/Kconfig').read()
          i=s.find('config HAS_LTO_CLANG')
          if i<0: raise SystemExit('no node')
          j=s.find('\nconfig ',i+10)
          k=s.find('\nchoice ',i+10)
          if k>0 and k<j: j=k
          blk=s[i:j]
          out=[]
          for ln in blk.split('\n'):
              if ln.strip().startswith('depends on'):
                  out.append('# [disabled] '+ln.strip())
              elif ln.strip()=='def_bool y':
                  out.append('\tbool'); out.append('\tdefault y')
              else:
                  out.append(ln)
          open('arch/Kconfig','w').write(s[:i]+'\n'.join(out)+s[j:])
          print('HAS_LTO_CLANG forced')
          PY
      - name: kabi patches
        if: github.event.inputs.with_kabi_patches == 'true'
        run: |
          cd gki
          echo "=== BEFORE: original field locations ==="
          grep -n "struct sysv_sem\|struct sysv_shm" include/linux/sched.h | head -5 || true
          grep -n "unsigned long mq_bytes" include/linux/sched/user.h | head -3 || true
          echo "=== APPLY 001 ==="
          patch -p1 -F3 --forward < ../kernel-patches/001-sysvipc-kabi.patch
          echo "001 exit=$?"
          echo "=== APPLY 002 ==="
          patch -p1 -F3 --forward < ../kernel-patches/002-posix-mqueue-kabi.patch
          echo "002 exit=$?"
          echo "=== AFTER ==="
          grep -n "ANDROID_KABI_USE(6" include/linux/sched.h || { echo "NO_SLOT6"; exit 1; }
          grep -n "ANDROID_KABI_USE(1, unsigned long mq_bytes)" include/linux/sched/user.h || { echo "NO_MQ"; exit 1; }
          grep -n "// struct sysv_sem\|// struct sysv_shm" include/linux/sched.h || { echo "SYSV_FIELD_NOT_COMMENTED"; exit 1; }
          grep -n "//unsigned long mq_bytes" include/linux/sched/user.h || { echo "MQ_FIELD_NOT_COMMENTED"; exit 1; }
          echo "KABI_PATCHES_OK"
      - name: configure
        run: |
          cd gki
          cp ../device-ref/device.config arch/arm64/configs/gki_defconfig
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- gki_defconfig 2>&1 | tail -3
          ./scripts/config --file .config -d TRIM_UNUSED_KSYMS -d MODULE_SIG_ALL -d MODULE_SIG -d DEBUG_INFO -d DEBUG_INFO_DWARF4
          CS="${{ github.event.inputs.cfg_set }}"
          echo "cfg_set = $CS"
          case "$CS" in
            none)
              echo "core configs SKIPPED - pure device.config (=vC, known bootable)"
              ;;
            core)
              for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS; do ./scripts/config --file .config -e $c; done
              ;;
            sysvipc)
              for c in SYSVIPC POSIX_MQUEUE; do ./scripts/config --file .config -e $c; done
              ;;
            ns)
              for c in IPC_NS PID_NS; do ./scripts/config --file .config -e $c; done
              ;;
            sysvipc_only)
              for c in SYSVIPC; do ./scripts/config --file .config -e $c; done
              ;;
            mqueue_only)
              for c in POSIX_MQUEUE; do ./scripts/config --file .config -e $c; done
              ;;
            no_sysvipc)
              for c in POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS; do ./scripts/config --file .config -e $c; done
              ;;
            no_sysvipc_nodevtmpfs)
              for c in POSIX_MQUEUE IPC_NS PID_NS; do ./scripts/config --file .config -e $c; done
              ;;
            docker)
              # vJ base + full Docker/container networking support (no SYSVIPC!)
              for c in POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS \
                       NETFILTER_XT_MATCH_ADDRTYPE CGROUP_PIDS CGROUP_DEVICE \
                       NETFILTER_XT_TARGET_LOG NETFILTER_XT_MATCH_RECENT \
                       TMPFS_XATTR TMPFS_POSIX_ACL; do
                ./scripts/config --file .config -e $c
              done
              ;;
            docker_noaddrtype)
              # isolate whether ADDRTYPE is the bootloop culprit
              for c in POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS CGROUP_PIDS CGROUP_DEVICE; do
                ./scripts/config --file .config -e $c
              done
              ;;
            cgdevice)
              # vJ base + CGROUP_DEVICE only
              for c in POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS CGROUP_DEVICE; do
                ./scripts/config --file .config -e $c
              done
              ;;
            cgpids)
              # vJ base + CGROUP_PIDS only
              for c in POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS CGROUP_PIDS; do
                ./scripts/config --file .config -e $c
              done
              ;;
            tmpfs)
              # vJ base + TMPFS_XATTR + TMPFS_POSIX_ACL only
              for c in POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS TMPFS_XATTR TMPFS_POSIX_ACL; do
                ./scripts/config --file .config -e $c
              done
              ;;
            nf)
              # vJ base + the three netfilter extras only
              for c in POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS \
                       NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_TARGET_LOG NETFILTER_XT_MATCH_RECENT; do
                ./scripts/config --file .config -e $c
              done
              ;;
            cg_all)
              # vJ base + both cgroup extras (CGROUP_PIDS + CGROUP_DEVICE)
              for c in POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS CGROUP_PIDS CGROUP_DEVICE; do
                ./scripts/config --file .config -e $c
              done
              ;;
            devtmpfs)
              for c in DEVTMPFS; do ./scripts/config --file .config -e $c; done
              ;;
            full)
              for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE \
                       USER_NS IP6_NF_NAT IP6_NF_TARGET_MASQUERADE MACVLAN \
                       NETFILTER_XT_TARGET_LOG NETFILTER_XT_MATCH_RECENT NETFILTER_XT_SET \
                       IP_SET IP_SET_HASH_IP IP_SET_HASH_NET TMPFS_XATTR TMPFS_POSIX_ACL; do
                ./scripts/config --file .config -e $c
              done
              ;;
            *)
              echo "unknown cfg_set: $CS"; exit 1
              ;;
          esac
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3
          grep -E "^CONFIG_(HAS_LTO_CLANG|LTO_CLANG_FULL|CFI_CLANG|TRIM_UNUSED_KSYMS|SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|CGROUPS|MEMCG|BLK_CGROUP|SECCOMP|NETFILTER|NF_CONNTRACK|IP_NF_IPTABLES|IP_NF_NAT|IP_NF_FILTER|IP_NF_TARGET_MASQUERADE|NETFILTER_XT_TARGET_MASQUERADE|NETFILTER_XT_MATCH_ADDRTYPE|NETFILTER_XT_TARGET_LOG|NETFILTER_XT_MATCH_RECENT|NETFILTER_XT_TARGET_TPROXY|NETFILTER_XT_TARGET_REDIRECT|BRIDGE|VETH|DUMMY|TUN|OVERLAY_FS|CGROUP_PIDS|CGROUP_DEVICE|TMPFS_XATTR|TMPFS_POSIX_ACL)=" .config | tee ../final_cfg.txt
      - name: force exact vermagic (critical for vendor .ko load)
        run: |
          cd gki
          # The stock device kernel reports:
          #   vermagic recorded inside the shipped vendor modules (9 samples,
          #   kmods/*.ko .modinfo) is exactly:
          #     5.10.149-gki-gfaaad4fb9dbf SMP preempt mod_unload modversions aarch64
          # module loader compares vermagic as a strict string, so ANY deviation
          # (e.g. the "-dirty" that a patched tree produces) makes every vendor
          # .ko fail with "version magic mismatch" -> early boot loop, no adbd.
          # Neutralise scripts/setlocalversion so the git-dirty suffix can never
          # be appended, and pin CONFIG_LOCALVERSION to the device value.
          sed -i '/^CONFIG_LOCALVERSION=/d' .config
          ./scripts/config --file .config -d LOCALVERSION_AUTO
          echo 'CONFIG_LOCALVERSION="-gki-gfaaad4fb9dbf"' >> .config
          printf '#!/bin/sh\necho "-gki-gfaaad4fb9dbf"\n' > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          rm -f include/config/kernel.release
          echo "--- kernel.release preview (regenerated at build) ---"
          grep -E '^CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|PREEMPT|SMP|MODVERSIONS|MODULE_UNLOAD)' .config
      - name: build
        run: |
          cd gki
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc) Image 2>&1 | tail -25
          ls -la arch/arm64/boot/Image vmlinux.symvers
          echo "--- UTS_RELEASE / vermagic gate ---"
          echo "kernel.release = $(cat include/config/kernel.release)"
          strings arch/arm64/boot/Image | grep -m1 'Linux version'
          if [ "$(cat include/config/kernel.release)" != "5.10.149-gki-gfaaad4fb9dbf" ]; then
            echo "::error::UTS_RELEASE mismatch - vendor modules would be rejected"
            exit 1
          fi
          echo "::notice::UTS_RELEASE matches device exactly"
      - name: ABI check
        run: |
          cd gki
          python3 - <<'PY'
          dev={}
          for ln in open('../device-ref/vmlinux.symvers'):
              p=ln.split('\t')
              if len(p)>=2: dev[p[1]]=p[0]
          new={}
          for ln in open('vmlinux.symvers'):
              p=ln.split('\t')
              if len(p)>=2: new[p[1]]=p[0]
          common=[k for k in new if k in dev]
          diff=[k for k in common if dev[k]!=new[k]]
          print(f"vs device GKI symvers: new={len(new)} dev={len(dev)} common={len(common)} crc_diff={len(diff)}")
          for k in diff[:25]: print(f"  DIFF {k}: dev={dev[k]} new={new[k]}")
          ref={}
          for ln in open('../device-ref/crc_ref.txt'):
              p=ln.strip().split('\t')
              if len(p)==2: ref[p[0]]=p[1]
          ok=bad=miss=0; badlist=[]
          for k,v in ref.items():
              if k not in new: miss+=1
              elif new[k].lower()==v.lower(): ok+=1
              else: bad+=1; badlist.append(k)
          print(f"vs vendor .ko crc_ref: ok={ok} bad={bad} missing={miss}")
          for k in badlist[:25]: print(f"  BAD {k}: dev={ref[k]} new={new.get(k)}")
          print("ABI MATCH" if bad==0 else "ABI MISMATCH")
          PY
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-kabi${{ github.event.inputs.with_kabi_patches }}-cfg-${{ github.event.inputs.cfg_set }}
          path: |
            gki/arch/arm64/boot/Image
            gki/vmlinux.symvers
            gki/vmlinux
            final_cfg.txt
          if-no-files-found: warn
