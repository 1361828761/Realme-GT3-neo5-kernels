name: Realme official tree build (T source)
on:
  workflow_dispatch:
    inputs:
      use_device_config:
        required: true
        default: 'true'
      kabi_patches:
        required: true
        default: 'true'
      enable_droidspaces:
        required: true
        default: 'true'
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            python3 git curl cpio rsync kmod device-tree-compiler clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu
          for b in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf llvm-size; do
            s=$(ls /usr/bin/${b}-12 2>/dev/null || ls /usr/bin/${b%%.*}-12 2>/dev/null || true)
            if [ -n "$s" ]; then sudo ln -sf "$s" /usr/local/bin/$b; fi
          done
          which clang ld.lld llvm-ar llvm-nm llvm-objcopy
          clang --version | head -1
      - name: clone realme official T source
        run: |
          git clone --depth=1 -b master \
            https://github.com/realme-kernel-opensource/realme_GTneo5-AndroidT-kernel-source gki
          cd gki
          echo "--- Makefile version ---"; head -5 Makefile
          echo "--- gki_defconfig ---"; ls -la arch/arm64/configs/gki_defconfig
          echo "--- top dirs ---"; ls
      - name: stub missing Kconfig sources
        run: |
          cd gki
          python3 - <<'PY'
          import os,re
          missing=set()
          for root,dirs,files in os.walk('.'):
              if '/.git' in root: continue
              for fn in files:
                  if fn=='Kconfig':
                      fp=os.path.join(root,fn)
                      try: txt=open(fp,encoding='utf-8',errors='replace').read()
                      except: continue
                      for m in re.finditer(r'^\s*source\s+"([^"]+)"', txt, re.M):
                          tgt=m.group(1)
                          if tgt.startswith('$'): continue
                          # Kconfig 'source' paths are relative to the TREE ROOT ($srctree),
                          # never to the directory of the containing Kconfig file.
                          cand=os.path.normpath(tgt)
                          if not os.path.exists(cand):
                              missing.add(cand)
          print('MISSING',len(missing))
          for m in sorted(missing):
              print('  stub',m)
              d=os.path.dirname(m)
              if d: os.makedirs(d,exist_ok=True)
              open(m,'a').close()
          PY
      - name: force HAS_LTO_CLANG
        run: |
          cd gki
          python3 - <<'PY'
          s=open('arch/Kconfig').read()
          i=s.find('config HAS_LTO_CLANG')
          if i<0: raise SystemExit('no HAS_LTO_CLANG')
          j=s.find('\nconfig ',i+10)
          k=s.find('\nchoice ',i+10)
          if k>0 and k<j: j=k
          out=[]
          for ln in s[i:j].split('\n'):
              t=ln.strip()
              if t.startswith('depends on'): out.append('# [disabled] '+t)
              elif t=='def_bool y': out.append('\tbool'); out.append('\tdefault y')
              else: out.append(ln)
          open('arch/Kconfig','w').write(s[:i]+'\n'.join(out)+s[j:])
          print('HAS_LTO_CLANG forced on')
          PY
          grep -n -A6 "^config HAS_LTO_CLANG" arch/Kconfig
      - name: kabi patches
        if: github.event.inputs.kabi_patches == 'true'
        run: |
          cd gki
          patch -p1 -F3 --forward < ../kernel-patches/001-sysvipc-kabi.patch || true
          patch -p1 -F3 --forward < ../kernel-patches/002-posix-mqueue-kabi.patch || true
          grep -n "ANDROID_KABI_USE(6" include/linux/sched.h || echo NO_SLOT6
          grep -n "ANDROID_KABI_USE(1, unsigned long mq_bytes)" include/linux/sched/user.h || echo NO_MQ
      - name: configure
        run: |
          cd gki
          if [ "${{ github.event.inputs.use_device_config }}" = "true" ]; then
            cp ../device-ref/device.config arch/arm64/configs/gki_defconfig
          fi
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- gki_defconfig 2>&1 | tail -5
          ./scripts/config --file .config -d TRIM_UNUSED_KSYMS -d MODULE_SIG_ALL -d MODULE_SIG -d DEBUG_INFO -d DEBUG_INFO_DWARF4
          if [ "${{ github.event.inputs.enable_droidspaces }}" = "true" ]; then
            for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE \
                     USER_NS IP6_NF_NAT IP6_NF_TARGET_MASQUERADE MACVLAN \
                     NETFILTER_XT_TARGET_LOG NETFILTER_XT_MATCH_RECENT NETFILTER_XT_SET \
                     IP_SET IP_SET_HASH_IP IP_SET_HASH_NET TMPFS_XATTR TMPFS_POSIX_ACL; do
              ./scripts/config --file .config -e $c
            done
          fi
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -5
          grep -E "^CONFIG_(HAS_LTO_CLANG|LTO_CLANG_FULL|CFI_CLANG|SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|TRIM_UNUSED_KSYMS)=" .config | tee ../realme_cfg.txt
      - name: build
        run: |
          cd gki
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc) Image 2>&1 | tail -30
          ls -la arch/arm64/boot/Image vmlinux.symvers 2>&1
      - name: ABI check
        if: always()
        run: |
          cd gki
          python3 - <<'PY' | tee ../realme_abi.txt
          import os
          def load(p):
              d={}
              if not os.path.exists(p): return d
              for ln in open(p,encoding='utf-8',errors='replace'):
                  f=ln.rstrip('\n').split('\t')
                  if len(f)>=2:
                      try: d[f[1]]=int(f[0],16)
                      except: pass
              return d
          new=load('vmlinux.symvers'); dev=load('../device-ref/vmlinux.symvers')
          print(f"new_exports={len(new)} dev_exports={len(dev)}")
          common=[k for k in new if k in dev]
          diff=[k for k in common if dev[k]!=new[k]]
          print(f"common={len(common)} crc_diff={len(diff)}")
          for k in diff[:20]: print(f"  DIFF {k}: dev={dev[k]:#x} new={new[k]:#x}")
          ref={}
          for ln in open('../device-ref/crc_ref.txt',encoding='utf-8',errors='replace'):
              f=ln.rstrip('\n').split('\t')
              if len(f)==2:
                  try: ref[f[0]]=int(f[1],16)
                  except: pass
          ok=bad=miss=0; badl=[]
          for k,v in ref.items():
              if k not in new: miss+=1
              elif new[k]==v: ok+=1
              else: bad+=1; badl.append((k,v,new[k]))
          print(f"vendor_ref: ok={ok} bad={bad} missing={miss}")
          for k,v,n in badl[:20]: print(f"  BAD {k}: dev={v:#x} new={n:#x}")
          print(">>> ABI MATCH" if bad==0 and len(diff)==0 else ">>> ABI MISMATCH")
          PY
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realme_final
          path: |
            gki/arch/arm64/boot/Image
            gki/vmlinux.symvers
            gki/vmlinux
            realme_cfg.txt
            realme_abi.txt
          if-no-files-found: warn
